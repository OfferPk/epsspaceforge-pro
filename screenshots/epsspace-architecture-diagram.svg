<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <text x="40" y="46" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">EPSSpaceForge Pro v1.0.0 — ECSS-E-ST-20C &amp; ECSS-E-ST-20-20C Architecture Blueprint</text>
  <text x="40" y="70" fill="#94a3b8" font-family="monospace" font-size="13">Photovoltaic S3R/MPPT Array • Li-Ion (N-1) Battery Pack • Regulated 28V/50V/100V Bus • Solid-State LCL/RLCL/FCL PDU</text>

  <!-- Solar Array PVA Block -->
  <rect x="40" y="110" width="240" height="165" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="58" y="140" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">1. PVA SOLAR ARRAY</text>
  <text x="58" y="162" fill="#e2e8f0" font-family="monospace" font-size="12">ECSS-E-ST-20-08C GaAs 3J</text>
  <text x="58" y="184" fill="#94a3b8" font-family="monospace" font-size="11">• AM0 Flux: 1361 W/m² (η=29.5%)</text>
  <text x="58" y="204" fill="#94a3b8" font-family="monospace" font-size="11">• BOL / EOL Radiation L_d Model</text>
  <text x="58" y="224" fill="#94a3b8" font-family="monospace" font-size="11">• (N+1) Redundant String Matrix</text>
  <text x="58" y="244" fill="#34d399" font-family="monospace" font-size="11">• Blocking Diodes &amp; S3R Shunts</text>

  <!-- Li-Ion Battery Pack Block -->
  <rect x="40" y="315" width="240" height="170" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="58" y="345" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold">2. LI-ION BATTERY PACK</text>
  <text x="58" y="367" fill="#e2e8f0" font-family="monospace" font-size="12">ECSS-E-ST-20C Clause 5.3.4</text>
  <text x="58" y="389" fill="#94a3b8" font-family="monospace" font-size="11">• LEO DoD &le; 30% / GEO &le; 70%</text>
  <text x="58" y="409" fill="#94a3b8" font-family="monospace" font-size="11">• (N-1) Parallel String Survival</text>
  <text x="58" y="429" fill="#94a3b8" font-family="monospace" font-size="11">• BCR / BDR Charge Control</text>
  <text x="58" y="449" fill="#38bdf8" font-family="monospace" font-size="11">• Cell Balancing &amp; Bypass</text>

  <!-- Central Main Regulated Power Bus -->
  <rect x="350" y="110" width="250" height="375" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2.2"/>
  <text x="368" y="140" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="bold">3. REGULATED MAIN BUS</text>
  <text x="368" y="162" fill="#e2e8f0" font-family="monospace" font-size="12">ECSS-E-ST-20C Clause 5.2</text>
  <text x="368" y="190" fill="#94a3b8" font-family="monospace" font-size="11">• 28V Bus (&le; 1.5 kW LEO/SmallSat)</text>
  <text x="368" y="212" fill="#94a3b8" font-family="monospace" font-size="11">• 50V Bus (&le; 8.0 kW MEO/EO)</text>
  <text x="368" y="234" fill="#94a3b8" font-family="monospace" font-size="11">• 100V Bus (&gt; 8.0 kW GEO HTS)</text>
  <text x="368" y="266" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Impedance Conditioning:</text>
  <text x="368" y="288" fill="#94a3b8" font-family="monospace" font-size="11">• 20·log10(Z_load/Z_src) &ge; 5 dB</text>
  <text x="368" y="310" fill="#94a3b8" font-family="monospace" font-size="11">• Main Bus Ripple &lt; 1.0% V_nom</text>
  <text x="368" y="342" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">Orbital Energy Solver:</text>
  <text x="368" y="364" fill="#94a3b8" font-family="monospace" font-size="11">• T_orb = T_sun + T_ecl</text>
  <text x="368" y="386" fill="#94a3b8" font-family="monospace" font-size="11">• EOL Energy Margin &ge; +10.0%</text>
  <text x="368" y="408" fill="#94a3b8" font-family="monospace" font-size="11">• Single-Point Failure Free</text>

  <!-- LCL / RLCL / FCL Power Distribution Unit -->
  <rect x="670" y="110" width="250" height="375" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <text x="688" y="140" fill="#c084fc" font-family="monospace" font-size="14" font-weight="bold">4. LCL / RLCL / FCL PDU</text>
  <text x="688" y="162" fill="#e2e8f0" font-family="monospace" font-size="12">ECSS-E-ST-20-20C Clause 5.4</text>
  <text x="688" y="190" fill="#94a3b8" font-family="monospace" font-size="11">• LCL-01: OBC &amp; SpaceWire (RLCL)</text>
  <text x="688" y="212" fill="#94a3b8" font-family="monospace" font-size="11">• LCL-02: ADCS Reaction Wheels</text>
  <text x="688" y="234" fill="#94a3b8" font-family="monospace" font-size="11">• LCL-03: Optical/RF Payload</text>
  <text x="688" y="256" fill="#94a3b8" font-family="monospace" font-size="11">• LCL-04: X/Ka-Band Downlink</text>
  <text x="688" y="278" fill="#94a3b8" font-family="monospace" font-size="11">• LCL-05: Propulsion &amp; Heaters</text>
  <text x="688" y="312" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Protection Guarantees:</text>
  <text x="688" y="334" fill="#94a3b8" font-family="monospace" font-size="11">• Drop &Delta;V_LCL &le; 1.0% V_bus</text>
  <text x="688" y="356" fill="#94a3b8" font-family="monospace" font-size="11">• T_trip &ge; 1.5&times; T_inrush</text>
  <text x="688" y="378" fill="#34d399" font-family="monospace" font-size="11">• 10/10 Normative Auditor</text>

  <!-- Interconnect Arrows -->
  <line x1="280" y1="190" x2="350" y2="190" stroke="#38bdf8" stroke-width="3"/>
  <line x1="280" y1="395" x2="350" y2="395" stroke="#34d399" stroke-width="3"/>
  <line x1="600" y1="295" x2="670" y2="295" stroke="#fbbf24" stroke-width="3"/>
</svg>
