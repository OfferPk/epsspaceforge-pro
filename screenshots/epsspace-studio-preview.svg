  <text x="40" y="52" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">EPSSpaceForge Pro v1.0.0 — Glass-Cockpit Spacecraft EPS &amp; LCL Studio</text>
  <text x="720" y="52" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold">10 / 10 ECSS-20C PASS</text>

  <!-- KPI Cards -->
  <rect x="20" y="90" width="215" height="75" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="35" y="115" fill="#94a3b8" font-family="monospace" font-size="11">MAIN BUS &amp; MARGIN</text>
  <text x="35" y="145" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="bold">28.0 V (+16.7%)</text>

  <rect x="255" y="90" width="215" height="75" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="270" y="115" fill="#94a3b8" font-family="monospace" font-size="11">PVA SOLAR ARRAY EOL</text>
  <text x="270" y="145" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold">754.0 W (15s×8p)</text>

  <rect x="490" y="90" width="215" height="75" rx="8" fill="#0f172a" stroke="#34d399"/>
  <text x="505" y="115" fill="#94a3b8" font-family="monospace" font-size="11">LI-ION ECLIPSE DOD</text>
  <text x="505" y="145" fill="#34d399" font-family="monospace" font-size="18" font-weight="bold">22.47% (&le;30%)</text>

  <rect x="725" y="90" width="215" height="75" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="740" y="115" fill="#94a3b8" font-family="monospace" font-size="11">LCL PROTECTION BUS</text>
  <text x="740" y="145" fill="#34d399" font-family="monospace" font-size="18" font-weight="bold">5/5 CLOSED (8.5dB)</text>

  <!-- Main Orbital Plot Preview -->
  <rect x="20" y="185" width="920" height="330" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="40" y="215" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">ORBITAL SUNLIGHT / ECLIPSE POWER &amp; BATTERY SOC TELEMETRY + LCL MATRIX</text>
  <polyline fill="none" stroke="#38bdf8" stroke-width="3" points="60,260 520,260 525,450 880,450"/>
  <polyline fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" points="60,330 520,330 525,370 880,370"/>
  <polyline fill="none" stroke="#34d399" stroke-width="2.5" points="60,280 520,245 880,320"/>
